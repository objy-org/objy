name: Bug report
description: Report reproducible incorrect behavior or a regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OBJY DB. Remove credentials and customer data from every example and log.
  - type: input
    id: version
    attributes:
      label: OBJY DB version
      placeholder: 0.2.0-alpha.0
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - "@objy/db in Node.js"
        - "@objy/db in a browser"
        - "@objy/server single node"
        - "@objy/server cluster"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
      description: Explain what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest code, request, config, or repository that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Node.js or browser version, object count, shard/replica count, and storage provider when relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and diagnostics
      description: Include relevant logs and compact `/api/config` status with all secrets removed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, tokens, customer data, and private URLs.
          required: true
