name: Server Scale Test

on:
  workflow_dispatch:
    inputs:
      objects:
        description: Objects in the server workload
        required: true
        default: "1000000"
        type: string

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run server consistency and performance workload
        env:
          TEST_OBJECTS: ${{ inputs.objects }}
        run: npm run test:scale -- "--objects=$TEST_OBJECTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: server-performance-${{ inputs.objects }}
          path: .performance-results/
          if-no-files-found: warn
