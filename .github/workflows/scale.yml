name: Server Scale Test

on:
  workflow_dispatch:
    inputs:
      objects:
        description: Objects in the server workload
        required: true
        default: "1000000"
        type: string

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run server consistency and performance workload
        env:
          TEST_OBJECTS: ${{ inputs.objects }}
        run: npm run test:scale -- "--objects=$TEST_OBJECTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-performance-${{ inputs.objects }}
          path: .performance-results/
          if-no-files-found: warn
