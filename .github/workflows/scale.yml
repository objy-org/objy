name: Server Scale Test

on:
  workflow_dispatch:
    inputs:
      objects:
        description: Objects in the server workload
        required: true
        default: "1000000"
        type: string

permissions:
  contents: read

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run server consistency and performance workload
        env:
          TEST_OBJECTS: ${{ inputs.objects }}
        run: npm run test:scale -- "--objects=$TEST_OBJECTS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: server-performance-${{ inputs.objects }}
          path: .performance-results/
          if-no-files-found: warn
