name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - name: Verify tag matches package version
        run: node -e 'if (`v${require("./package.json").version}` !== process.env.GITHUB_REF_NAME) throw new Error("release tag must match package version")'
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
