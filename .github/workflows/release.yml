name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v prefix
        required: true
        type: string
      npm_tag:
        description: npm distribution tag
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - latest

permissions:
  contents: write
  id-token: write

concurrency:
  group: objy-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: npm
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.npm_tag }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate release request
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Releases must run from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be an explicit semantic version without a v prefix" >&2
            exit 1
          fi
      - name: Use trusted-publishing npm CLI
        run: |
          npm config delete always-auth --location=user
          npm install --global npm@12.2.1
      - run: npm ci
      - name: Apply release version
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps
      - run: npm run test:browser
      - run: npm run test:packages
      - run: npm run test:universal -- --objects=20000
      - name: Build and verify final release packages
        run: npm run check:package
      - name: Verify release artifacts
        working-directory: .release/artifacts
        run: shasum -a 256 -c SHA256SUMS
      - name: Commit and tag the release
        run: |
          push_with_retry() {
            local refspec="$1"
            for attempt in 1 2 3 4; do
              if git push origin "$refspec"; then return 0; fi
              if [[ "$attempt" == 4 ]]; then return 1; fi
              sleep $((attempt * 5))
            done
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Release $RELEASE_VERSION"
            push_with_retry "HEAD:$DEFAULT_BRANCH"
          fi

          TAG="v$RELEASE_VERSION"
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-list -n 1 "$TAG")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $TAG already points to another commit" >&2
              exit 1
            fi
          else
            git tag -a "$TAG" -m "OBJY DB $RELEASE_VERSION"
            push_with_retry "refs/tags/$TAG"
          fi
      - name: Publish npm packages
        run: |
          package_visible() {
            local package_name="$1"
            [[ "$(npm view "$package_name@$RELEASE_VERSION" version 2>/dev/null || true)" == "$RELEASE_VERSION" ]]
          }
          wait_until_visible() {
            local package_name="$1"
            for attempt in $(seq 1 30); do
              if package_visible "$package_name"; then return 0; fi
              echo "Waiting for $package_name@$RELEASE_VERSION to become visible ($attempt/30)"
              sleep 10
            done
            return 1
          }
          publish_if_missing() {
            local package_name="$1"
            local artifact="$2"
            shift 2
            if package_visible "$package_name"; then
              echo "$package_name@$RELEASE_VERSION is already published"
            elif ! npm publish "$artifact" --tag "$NPM_TAG" --provenance "$@"; then
              echo "Publish did not complete cleanly; checking for an already accepted release"
              wait_until_visible "$package_name"
            else
              wait_until_visible "$package_name"
            fi
            npm dist-tag add "$package_name@$RELEASE_VERSION" "$NPM_TAG"
          }

          publish_if_missing "@objy/db" ".release/artifacts/objy-db-$RELEASE_VERSION.tgz" --access public
          publish_if_missing "@objy/server" ".release/artifacts/objy-server-$RELEASE_VERSION.tgz" --access public
      - name: Create GitHub release
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" .release/artifacts/* --clobber
          elif [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release create "$TAG" .release/artifacts/* --generate-notes --verify-tag --prerelease
          else
            gh release create "$TAG" .release/artifacts/* --generate-notes --verify-tag
          fi
